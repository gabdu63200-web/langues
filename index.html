/* ==========================================
   FLASHMASTER - VARIABLES
   ========================================== */

:root{
    --primary:#5B5CEB;
    --primary-light:#7B7CF8;
    --primary-dark:#4344C7;
    --secondary:#8B5CF6;
    --accent:#00C2FF;
    --success:#22C55E;
    --warning:#F59E0B;
    --danger:#EF4444;
    --background:#F5F7FB;
    --surface:#FFFFFF;
    --surface-alt:#F1F5F9;
    --border:#E5E7EB;
    --text:#111827;
    --text-light:#6B7280;
    --white:#FFFFFF;
    --gradient-primary:linear-gradient(135deg,#5B5CEB,#7C3AED);
    --gradient-blue:linear-gradient(135deg,#00C6FF,#0072FF);
    --gradient-green:linear-gradient(135deg,#22C55E,#16A34A);
    --gradient-red:linear-gradient(135deg,#F87171,#EF4444);
    --gradient-background:linear-gradient(145deg,#EEF2FF,#F8FAFC);
    --font:"Poppins",sans-serif;
    --fs-xs:.75rem;
    --fs-sm:.9rem;
    --fs-md:1rem;
    --fs-lg:1.2rem;
    --fs-xl:1.6rem;
    --fs-2xl:2rem;
    --fs-3xl:2.5rem;
    --light:300;
    --normal:400;
    --medium:500;
    --semibold:600;
    --bold:700;
    --space-1:4px;
    --space-2:8px;
    --space-3:12px;
    --space-4:16px;
    --space-5:20px;
    --space-6:24px;
    --space-7:32px;
    --space-8:40px;
    --space-9:56px;
    --radius-sm:8px;
    --radius:12px;
    --radius-lg:20px;
    --radius-xl:28px;
    --radius-round:999px;
    --shadow-xs:0 2px 4px rgba(0,0,0,.05);
    --shadow-sm:0 4px 10px rgba(0,0,0,.08);
    --shadow:0 10px 25px rgba(0,0,0,.12);
    --shadow-lg:0 20px 45px rgba(0,0,0,.18);
    --shadow-card:0 18px 45px rgba(91,92,235,.15);
    --fast:.2s;
    --normal-speed:.35s;
    --slow:.6s;
    --sidebar-width:300px;
    --topbar-height:80px;
    --card-width:650px;
    --card-height:400px;
    --button-height:52px;
    --button-radius:14px;
    --z-sidebar:20;
    --z-modal:100;
    --z-toast:999;
}
body.dark{--background:#111827;--surface:#1E293B;--surface-alt:#263548;--border:#334155;--text:#F8FAFC;--text-light:#CBD5E1;--shadow-card:0 18px 45px rgba(0,0,0,.45);--gradient-background:linear-gradient(145deg,#111827,#1F2937);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--gradient-background);color:var(--text);transition:background var(--slow),color var(--normal-speed);min-height:100vh;}
::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:999px;}::-webkit-scrollbar-track{background:transparent;}::selection{background:var(--primary);color:white;}a{text-decoration:none;color:inherit;}ul{list-style:none;}button{font-family:inherit;}input,textarea{font-family:inherit;font-size:1rem;}
</style>

#folderList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;overflow:auto;}
.folder-nav{position:relative;}

#folderDropdownList{display:none;}

.folder-header{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.folder-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.folder-toggle-btn{border:none;background:transparent;color:#5B5CEB;cursor:pointer;font-size:14px;padding:2px;display:flex;align-items:center;justify-content:center;}
#folderList li.folder-item-hidden{display:none;}
.folder-toggle-btn{border:2px solid #5B5CEB;background:#5B5CEB;color:white;cursor:pointer;font-size:16px;font-weight:700;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0;margin-right:6px;box-shadow:0 3px 8px rgba(91,92,235,.35);transition:.2s;}
.folder-toggle-btn:hover{background:#ecefff;color:#5B5CEB;transform:scale(1.1);}
#folderList li:hover{background:#ecefff;}
#folderList li.active{background:#5B5CEB;color:white;}
#folderList li.active .folder-toggle-btn{color:white;}
.daily-progress{width:min(560px,100%);background:white;border-radius:14px;padding:14px 16px;box-shadow:0 5px 15px rgba(0,0,0,.08);}
.daily-progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
.daily-progress-label,.daily-progress-summary{font-weight:600;font-size:14px;white-space:nowrap;}
.daily-progress-label{color:#16a34a;}
.daily-progress-summary{display:flex;align-items:center;gap:4px;}
.daily-progress-bar{flex:1;min-width:0;height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;}
.daily-progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:999px;transition:width .4s ease;}
body.dark .daily-progress{background:#1e293b;}body.dark .daily-progress-bar{background:#334155;}
body.daily-mode .flashcard{height:540px;}

.daily-rate-buttons{display:flex;justify-content:center;gap:12px;margin-top:30px;flex-wrap:wrap;}
.daily-rate-btn{border:none;padding:14px 26px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:.25s;letter-spacing:1px;}
.daily-rate-btn:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.15);}
.rate-yes{background:#22c55e;color:white;}
.rate-medium{background:#f59e0b;color:white;}
.rate-no{background:#ef4444;color:white;}
.daily-review-btn{border:none;background:linear-gradient(135deg,rgba(34,197,94,.55),rgba(22,163,74,.55));color:white;padding:15px;border-radius:15px;font-size:14px;font-weight:600;cursor:pointer;transition:.25s;width:100%;box-sizing:border-box;backdrop-filter:blur(4px);box-shadow:0 8px 22px rgba(34,197,94,.25);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:left;gap:12px;height:170px;position:relative;margin-bottom:25px;align-self:center;}
.daily-reset-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);color:#16a34a;font-size:18px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 3px 8px rgba(0,0,0,.15);line-height:1;}
.daily-reset-btn:hover{transform:rotate(180deg) scale(1.1);}
.daily-review-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(34,197,94,.35);}
.daily-review-title{font-size:14px;font-weight:600;}
.daily-review-stats{display:flex;gap:10px;width:100%;}
.daily-review-stat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:10px;}
.daily-review-num{font-size:22px;font-weight:700;}
.daily-review-label{font-size:12px;font-weight:500;opacity:.9;}
.daily-review-progress-row{display:flex;align-items:center;gap:10px;width:100%;}
.daily-review-progress{flex:1;height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;}
.daily-review-progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#fff,#e5ffef);border-radius:999px;transition:.4s;}
.daily-review-progress-text{font-size:11px;font-weight:600;white-space:nowrap;}
.main{flex:1;display:flex;flex-direction:column;padding:30px;overflow:hidden;}
.topbar{display:flex;justify-content:space-between;align-items:center;}
.topbar h1{margin:0;font-size:34px;}
.topbar p{color:#6b7280;margin-top:5px;}
.top-actions{display:flex;gap:10px;}
.top-actions button{width:50px;height:50px;border:none;border-radius:14px;background:white;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.08);transition:.25s;}
.top-actions button:hover{transform:translateY(-3px);}
.sidebar-actions{display:flex;gap:10px;margin-bottom:25px;}
.sidebar-actions button{flex:1;width:auto;height:50px;border:none;border-radius:14px;background:white;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.08);transition:.25s;font-size:20px;}
.sidebar-actions button:hover{transform:translateY(-3px);} 
.progress-section{margin-top:25px;background:white;padding:20px;border-radius:18px;box-shadow:0 5px 15px rgba(0,0,0,.08);height:200px;}
.progress-header{display:flex;justify-content:space-between;margin-bottom:10px;}
.progress-bar{width:100%;height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;}
.progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#5B5CEB,#7C3AED);transition:.4s;}
.study-area{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.flashcard{width:750px;max-width:95%;height:430px;perspective:1800px;cursor:pointer;position:relative;}
.card-inner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d;}
.flashcard.flipped .card-inner{transform:rotateY(180deg);}
.card-front,.card-back{position:absolute;width:100%;height:100%;border-radius:28px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;box-sizing:border-box;}
.card-front{background:linear-gradient(135deg,#5B5CEB,#7C3AED);color:white;box-shadow:0 25px 60px rgba(91,92,235,.30);}
.card-back{background:white;color:#222;transform:rotateY(180deg);box-shadow:0 25px 60px rgba(0,0,0,.12);}
.card-label{font-size:14px;letter-spacing:3px;opacity:.7;margin-bottom:25px;}
#question,#answer{font-size:42px;font-weight:700;line-height:1.4;}
.card-extra{margin:6px 30px 0;font-size:16px;color:#444;opacity:.85;white-space:pre-wrap;max-height:70px;overflow-y:auto;}

.card-extra-translation{font-style:italic;color:#5B5CEB;}

.card-front small{margin-top:35px;opacity:.8;}

.review-buttons{display:flex;justify-content:center;gap:18px;margin-top:35px;flex-wrap:wrap;}

.btn:hover{transform:translateY(-4px);}
.danger{background:#ef4444;}
.warning{background:#f59e0b;}
.success{background:#22c55e;}

.study-preview-back{border:none;background:linear-gradient(135deg,#5B5CEB,#7C3AED);color:white;padding:10px 14px;border-radius:999px;font-weight:600;font-size:14px;}

.navigation{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:25px;}

.navigation button{border:none;background:white;padding:15px 22px;border-radius:15px;cursor:pointer;font-size:15px;font-weight:600;transition:.25s;box-shadow:0 5px 15px rgba(0,0,0,.08);}
.navigation button:hover{transform:translateY(-3px);}
.back-home-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:none;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#5B5CEB,#7C3AED);color:white;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 22px rgba(91,92,235,.25);transition:.25s;}
.back-home-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(91,92,235,.32);} .back-home-btn:active{transform:translateY(0);}#floatingAdd{position:fixed;right:30px;bottom:30px;width:70px;height:70px;border:none;border-radius:50%;background:linear-gradient(135deg,#5B5CEB,#7C3AED);color:white;font-size:34px;cursor:pointer;box-shadow:0 20px 45px rgba(91,92,235,.35);transition:.3s;}#floatingAdd:hover{transform:rotate(90deg) scale(1.08);} .flashcard:hover{transform:translateY(-5px);} @keyframes floating{0%{transform:translateY(0px);}50%{transform:translateY(-8px);}100%{transform:translateY(0px);}}.flashcard{animation:floating 5s ease-in-out infinite;}
.modal{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);z-index:1000;}
.modal.show{display:flex;}
.modal-content{background:white;width:520px;max-width:92%;border-radius:24px;padding:30px;animation:popup .35s ease;box-shadow:0 25px 70px rgba(0,0,0,.20);}
.modal-content.large{width:700px;}
.modal-content h2{margin-top:0;margin-bottom:20px;}
.modal-content input,.modal-content textarea{width:100%;box-sizing:border-box;padding:16px;margin-bottom:18px;border-radius:14px;border:2px solid #e5e7eb;font-size:16px;font-family:inherit;}
.modal-content textarea{min-height:180px;resize:vertical;}
.modal-content input:focus,.modal-content textarea:focus{outline:none;border-color:#5B5CEB;}
.modal-buttons{display:flex;justify-content:flex-end;gap:12px;}
.modal-buttons button{padding:14px 22px;border:none;border-radius:14px;cursor:pointer;font-weight:600;}
.modal-buttons button:first-child{background:#e5e7eb;}
.modal-buttons button:last-child{background:#5B5CEB;color:white;}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(120px);background:#5B5CEB;color:white;padding:16px 30px;border-radius:999px;opacity:0;transition:.4s;font-weight:600;z-index:1500;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
body.dark{background:#0f172a;color:white;}
body.dark .sidebar{background:#1e293b;}
body.dark .top-actions button,body.dark .navigation button{background:#334155;color:white;}
body.dark .progress-section{background:#1e293b;}
body.dark .card-back{background:#1e293b;color:white;}
body.dark .modal-content{background:#1e293b;color:white;}

body.dark #folderList li{background:#334155;color:white;}
body.dark #folderList li.active{background:#5B5CEB;}
@keyframes popup{from{opacity:0;transform:translateY(25px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@media(max-width:1000px){.sidebar{width:240px;}.flashcard{width:95%;}}
</style>
