<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entraînement - FlashMaster</title>

<style>
:root{--primary:#5B5CEB;--primary-light:#7B7CF8;--primary-dark:#4344C7;--secondary:#8B5CF6;--accent:#00C2FF;--success:#22C55E;--warning:#F59E0B;--danger:#EF4444;--background:#F5F7FB;--surface:#FFFFFF;--surface-alt:#F1F5F9;--border:#E5E7EB;--text:#111827;--text-light:#6B7280;--white:#FFFFFF;--gradient-primary:linear-gradient(135deg,#5B5CEB,#7C3AED);--gradient-blue:linear-gradient(135deg,#00C6FF,#0072FF);--gradient-green:linear-gradient(135deg,#22C55E,#16A34A);--gradient-red:linear-gradient(135deg,#F87171,#EF4444);--gradient-background:linear-gradient(145deg,#EEF2FF,#F8FAFC);--font:"Poppins",sans-serif;--fs-xs:.75rem;--fs-sm:.9rem;--fs-md:1rem;--fs-lg:1.2rem;--fs-xl:1.6rem;--fs-2xl:2rem;--fs-3xl:2.5rem;--light:300;--normal:400;--medium:500;--semibold:600;--bold:700;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:32px;--space-8:40px;--space-9:56px;--radius-sm:8px;--radius:12px;--radius-lg:20px;--radius-xl:28px;--radius-round:999px;--shadow-xs:0 2px 4px rgba(0,0,0,.05);--shadow-sm:0 4px 10px rgba(0,0,0,.08);--shadow:0 10px 25px rgba(0,0,0,.12);--shadow-lg:0 20px 45px rgba(0,0,0,.18);--shadow-card:0 18px 45px rgba(91,92,235,.15);--fast:.2s;--normal-speed:.35s;--slow:.6s;--sidebar-width:300px;--topbar-height:80px;--card-width:650px;--card-height:400px;--button-height:52px;--button-radius:14px;--z-sidebar:20;--z-modal:100;--z-toast:999;}body.dark{--background:#111827;--surface:#1E293B;--surface-alt:#263548;--border:#334155;--text:#F8FAFC;--text-light:#CBD5E1;--shadow-card:0 18px 45px rgba(0,0,0,.45);--gradient-background:linear-gradient(145deg,#111827,#1F2937);}*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}body{font-family:var(--font);background:var(--gradient-background);color:var(--text);transition:background var(--slow),color var(--normal-speed);min-height:100vh;}::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:999px;}::-webkit-scrollbar-track{background:transparent;}::selection{background:var(--primary);color:white;}a{text-decoration:none;color:inherit;}ul{list-style:none;}button{font-family:inherit;}input,textarea{font-family:inherit;font-size:1rem;}
</style>

<style>
body{margin:0;font-family:"Poppins",sans-serif;background:#f4f6fb;color:#1f2937;overflow-y:auto;overflow-x:hidden;} #studyView{display:flex;flex-direction:column;min-height:100vh;padding:24px;gap:20px;} .back-home-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:none;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#5B5CEB,#7C3AED);color:white;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 22px rgba(91,92,235,.25);transition:.25s;} .back-home-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(91,92,235,.32);} .flashcard{width:min(760px,100%);height:480px;perspective:1800px;cursor:pointer;position:relative;align-self:center;} .card-inner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d;} .flashcard.flipped .card-inner{transform:rotateY(180deg);} .card-front,.card-back{position:absolute;width:100%;height:100%;border-radius:28px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;box-sizing:border-box;} .card-front{background:linear-gradient(135deg,#5B5CEB,#7C3AED);color:white;box-shadow:0 25px 60px rgba(91,92,235,.30);} .card-back{background:white;color:#222;transform:rotateY(180deg);box-shadow:0 25px 60px rgba(0,0,0,.12);overflow-y:auto;justify-content:flex-start;} .card-label{font-size:14px;letter-spacing:3px;opacity:.7;margin-bottom:25px;} #question{font-size:42px;font-weight:700;line-height:1.4;} #answer{font-size:34px;font-weight:700;line-height:1.4;margin-bottom:12px;} .back-question{margin-bottom:8px;} .back-question .back-question-label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.7;margin-bottom:4px;color:#5B5CEB;} .back-question .back-question-value{display:block;font-size:20px;font-weight:600;color:#4338ca;line-height:1.4;} .back-question .back-question-value::before{content:"";display:block;width:40px;height:3px;background:linear-gradient(90deg,#5B5CEB,#7C3AED);border-radius:999px;margin:0 auto 10px;} body.dark .back-question .back-question-value{color:#a5b4fc;} body.dark .back-question .back-question-label{color:#a5b4fc;} .card-extra{margin:8px 0 0;padding:12px 14px;font-size:16px;color:#1f2937;background:#f1f5f9;border:1px solid #e5e7eb;border-radius:12px;white-space:pre-wrap;max-height:120px;overflow-y:auto;width:100%;box-sizing:border-box;text-align:left;line-height:1.5;} .card-extra-label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.7;margin-bottom:4px;color:#5B5CEB;} .card-extra-value{display:block;font-weight:500;} .card-extra-translated{background:#eef2ff;color:#4338ca;border-color:#c7d2fe;} body.dark .card-extra{color:#f8fafc;background:#334155;border-color:#475569;} body.dark .card-extra-translated{background:#3b4cc0;color:#ffffff;border-color:#5B5CEB;} body.dark .card-extra-label{color:#a5b4fc;} .card-counter{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.85);color:#111827;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 10px 25px rgba(0,0,0,.12);} body.dark .card-counter{background:#475569;color:#f8fafc;} .navigation{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:10px;max-width:760px;width:100%;align-self:center;} .navigation button{border:none;background:white;padding:15px 22px;border-radius:15px;cursor:pointer;font-size:15px;font-weight:600;transition:.25s;box-shadow:0 5px 15px rgba(0,0,0,.08);} .navigation button:hover{transform:translateY(-3px);} body.dark{background:#0f172a;color:white;} body.dark .card-back{background:#1e293b;color:white;} body.dark .navigation button{background:#334155;color:white;} @media(max-width:700px){.flashcard{height:520px;}.navigation{flex-direction:column;}.navigation button{width:100%;}}
</style>

</head>

<body class="dark">

<div id="studyView">

    <button id="backHomeBtn" class="back-home-btn">
        ← Retour
    </button>

    <div id="flashcard" class="flashcard" style="cursor: pointer;">

        <div class="card-counter">

            <span id="currentCard">0</span>

            /

            <span id="totalCards">0</span>

        </div>

        <div class="card-inner">

            <div class="card-front">

                <span class="card-label">QUESTION</span>

                <h2 id="question">Aucune question</h2>

                <small>Touchez pour retourner</small>

            </div>

<div class="card-back">

                <div class="back-question">

                    <span class="back-question-label">QUESTION</span>

                    <span class="back-question-value" id="backQuestion">...</span>

                </div>

                <span class="card-label">RÉPONSE</span>

                <h2 id="answer">...</h2>

<p id="cardExplanation" class="card-extra" style="display:none;"><span class="card-extra-value"></span></p>

                <p id="cardExample" class="card-extra" style="display:none;"><span class="card-extra-value"></span></p>

                <p id="cardExampleTranslation" class="card-extra card-extra-translated" style="display:none;"><span class="card-extra-value"></span></p>

            </div>

        </div>

    </div>

    <section class="navigation">

        <button id="previousBtn">
            ⬅ Précédente
        </button>

        <button id="shuffleBtn">
            🔀 Mélanger
        </button>

        <button id="nextBtn">
            Suivante ➡
        </button>

    </section>

</div>

<script>
document.getElementById("studyView").style.display = "flex";
</script>

<script>
(() => {
const STORAGE_KEY = 'flashmaster-data-v2';
    const STUDY_FOLDER_KEY = 'flashmaster_study_folder';
    const STUDY_CARD_KEY = 'flashmaster_study_card';
    let state = null;
    let cards = [];
    let index = 0;
    let hasInitializedIndex = false;

    function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const parsed = JSON.parse(raw);
                if (parsed && Array.isArray(parsed.folders)) return parsed;
            } catch (e) {}
        }
        return { folders: [], statistics: { reviewed: 0, learned: 0 } };
    }

    function getFolder() {
        state = loadState();
        const folderId = localStorage.getItem(STUDY_FOLDER_KEY);
        return state.folders.find(folder => folder.id === folderId) || state.folders[0] || null;
    }

    function renderCard() {
        const folder = getFolder();
        const questionEl = document.getElementById('question');
        const answerEl = document.getElementById('answer');
        const backQuestionEl = document.getElementById('backQuestion');
        const explanationEl = document.getElementById('cardExplanation');
        const exampleEl = document.getElementById('cardExample');
        const exampleTranslationEl = document.getElementById('cardExampleTranslation');
        const currentEl = document.getElementById('currentCard');
        const totalEl = document.getElementById('totalCards');
        if (!folder) {
            questionEl.textContent = 'Aucune carte';
            answerEl.textContent = 'Retourne à l’accueil pour créer un dossier.';
            if (backQuestionEl) backQuestionEl.textContent = '';
            if (explanationEl) explanationEl.style.display = 'none';
            if (exampleEl) exampleEl.style.display = 'none';
            if (exampleTranslationEl) exampleTranslationEl.style.display = 'none';
            if (currentEl) currentEl.textContent = '0';
            if (totalEl) totalEl.textContent = '0';
            return;
        }
        cards = folder.cards || [];
        if (!cards.length) {
            questionEl.textContent = 'Aucune carte';
            answerEl.textContent = 'Ajoute une carte dans ce dossier.';
            if (backQuestionEl) backQuestionEl.textContent = '';
            if (explanationEl) explanationEl.style.display = 'none';
            if (exampleEl) exampleEl.style.display = 'none';
            if (exampleTranslationEl) exampleTranslationEl.style.display = 'none';
if (currentEl) currentEl.textContent = '0';
            if (totalEl) totalEl.textContent = '0';
            return;
        }
        if (!hasInitializedIndex) {
            const startCardId = localStorage.getItem(STUDY_CARD_KEY);
            if (startCardId) {
                const startIdx = cards.findIndex(c => String(c.id) === String(startCardId));
                if (startIdx >= 0) {
                    index = startIdx;
                }
                localStorage.removeItem(STUDY_CARD_KEY);
            }
            hasInitializedIndex = true;
        }
        index = Math.min(index, cards.length - 1);
        const card = cards[index];
        questionEl.textContent = card.question || 'Sans titre';
        answerEl.textContent = card.answer || '...';
        if (backQuestionEl) backQuestionEl.textContent = card.question || 'Sans titre';
        if (explanationEl) {
            const valueEl = explanationEl.querySelector('.card-extra-value');
            if (valueEl) valueEl.textContent = card.explanation || '';
            explanationEl.style.display = card.explanation ? '' : 'none';
        }
        let exampleText = card.example || '';
        let translationText = card.exampleTranslation || '';
        // Si la traduction n'est pas séparée, on l'extrait de l'exemple "phrase = traduction"
        if (!translationText && typeof exampleText === 'string' && exampleText.indexOf('=') >= 0) {
            const idx = exampleText.indexOf('=');
            translationText = exampleText.slice(idx + 1).trim();
            exampleText = exampleText.slice(0, idx).trim();
        }
        if (exampleEl) {
            const valueEl = exampleEl.querySelector('.card-extra-value');
            if (valueEl) valueEl.textContent = exampleText;
            exampleEl.style.display = exampleText ? '' : 'none';
        }
        if (exampleTranslationEl) {
            const valueEl = exampleTranslationEl.querySelector('.card-extra-value');
            if (valueEl) valueEl.textContent = translationText;
            exampleTranslationEl.style.display = translationText ? '' : 'none';
        }
        if (currentEl) currentEl.textContent = index + 1;
        if (totalEl) totalEl.textContent = cards.length;
        document.getElementById('flashcard').classList.remove('flipped');
    }

    function nextCard() {
        if (!cards.length) return;
        index = (index + 1) % cards.length;
        renderCard();
    }

    function previousCard() {
        if (!cards.length) return;
        index = (index - 1 + cards.length) % cards.length;
        renderCard();
    }

    function shuffleCards() {
        if (!cards.length) return;
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderCard();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const flashcard = document.getElementById('flashcard');
        if (flashcard) flashcard.addEventListener('click', () => flashcard.classList.toggle('flipped'));
        document.getElementById('previousBtn')?.addEventListener('click', previousCard);
        document.getElementById('nextBtn')?.addEventListener('click', nextCard);
        document.getElementById('shuffleBtn')?.addEventListener('click', shuffleCards);
        document.getElementById('backHomeBtn')?.addEventListener('click', () => window.location.href = 'index.html');
        renderCard();
    });
})();
</script>

</body>
</html>
